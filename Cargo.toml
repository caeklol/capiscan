[package]
name = "mc-scanner"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
async-bincode = { version = "0.8.0", features = ["futures"] }
bincode = { version = "2.0.1", features = ["serde"] }
clap = { version = "4.5.41", features = ["derive"] }
futures = "0.3.31"
humantime = "2.2.0"
ipnet = "2.11.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
thiserror = "2.0.12"
tokio = { version = "1.46.1", features = ["full", "net"] }
